<!-- Subtle Haptic Feedback Helper Script -->
<script>
    (function () {
      let count = 0;
      const counterDisplay = document.getElementById('counter-display');
      const summaryCount = document.getElementById('summary-count');
      const sushiTrigger = document.getElementById('sushi-trigger');
      const btnReset = document.getElementById('btn-reset');

      function updateUI(newCount, animate = true) {
        count = newCount;
        counterDisplay.textContent = count;
        summaryCount.textContent = count;

        if (animate) {
          counterDisplay.classList.add('scale-125');
          setTimeout(() => {
            counterDisplay.classList.remove('scale-125');
          }, 120);
        }
      }

      sushiTrigger.addEventListener('click', function () {
        updateUI(count + 1, true);
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(20);
        }
      });

      sushiTrigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          updateUI(count + 1, true);
        }
      });

      btnReset.addEventListener('click', function () {
        if (count > 0) {
          updateUI(0, false);
          counterDisplay.classList.add('opacity-40');
          setTimeout(() => {
            counterDisplay.classList.remove('opacity-40');
          }, 150);
        }
      });
    })();
  </script>
